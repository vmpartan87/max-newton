<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0;font:14px system-ui}[hidden]{display:none!important}</style></head><body>
<title>Max Newton – testiversio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Baloo+2:wght@500;600;700;800&display=swap">
<style>
/* Layout: koko ruudun 3D-paja; yläpalkki, oikealla inforuutu, alhaalla osahylly. Yksi tumma "pajan" ilme. */
:root{
  --ink:#16140f;
  --panel:rgba(24,22,18,.88);
  --panel-solid:#1e1b16;
  --line:#3b362c;
  --text:#f6ecd6;
  --muted:#b9ab90;
  --yellow:#ffc21a;
  --yellow-ink:#2a1f00;
  --green:#4cc36b;
  --amber:#ffab1f;
  --red:#ff4b39;
  --steel:#8f99a3;
  --f-display:'Bungee', 'Arial Black', Impact, sans-serif;
  --f-body:'Baloo 2', 'Trebuchet MS', 'Segoe UI', sans-serif;
  color-scheme:dark;
}
html,body{height:100%;background:var(--ink);color:var(--text);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--f-body);font-size:15px;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
#app{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.ui{position:absolute;z-index:5}

/* Top bar */
#top{left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) calc(env(safe-area-inset-right,0px) + 12px) 0 calc(env(safe-area-inset-left,0px) + 12px);pointer-events:none}
#top>*{pointer-events:auto}
.brand{font-family:var(--f-display);font-size:17px;letter-spacing:.04em;color:var(--yellow-ink);background:var(--yellow);padding:5px 12px 3px;border-radius:6px;box-shadow:0 3px 0 #a87b00;white-space:nowrap}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
#money{color:var(--yellow)}
#top .spacer{flex:1}
.tbtn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 12px;font-weight:700;white-space:nowrap}
.tbtn:active{transform:translateY(1px)}
#btnInfo{display:none}

/* Info panel */
#info{right:calc(env(safe-area-inset-right,0px) + 10px);top:calc(env(safe-area-inset-top,0px) + 54px);width:236px;max-height:calc(100% - 64px - var(--dockH,210px) - env(safe-area-inset-top,0px));overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#info h3{margin:0 0 6px;font-family:var(--f-display);font-weight:400;font-size:13px;letter-spacing:.06em;color:var(--yellow)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin-bottom:8px}
.stat{display:flex;flex-direction:column;line-height:1.05}
.stat b{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.delta{font-size:12px;font-weight:800;margin-left:3px}
.delta.up{color:var(--green)}.delta.down{color:var(--red)}
.meter{margin:6px 0 2px}
.meter .lbl{display:flex;justify-content:space-between;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.meter .lbl b{color:var(--text);font-size:12px}
.bar{position:relative;height:12px;border-radius:6px;overflow:hidden;background:#2b2720;margin-top:3px}
.zones{position:absolute;inset:0;display:flex}
.zones i{display:block;height:100%}
.needle{position:absolute;top:-2px;bottom:-2px;width:4px;margin-left:-2px;background:#fff;border-radius:2px;box-shadow:0 0 0 1px #000a;transition:left .25s}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;transition:width .2s}
.checks{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.ck{font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;background:#2b2720;color:var(--muted)}
.ck.ok{background:#1f3a26;color:#9be3ae}
.ck.no{background:#4a1e18;color:#ffb1a6}
.verdict{margin-top:8px;font-weight:800;font-size:14px}
.verdict.ok{color:var(--green)}
.verdict.no{color:#ffb1a6}

/* Big action */
#dock{left:0;right:0;bottom:0;display:flex;flex-direction:column;pointer-events:none}
#dockRow{display:flex;align-items:flex-end;gap:8px;padding:0 calc(env(safe-area-inset-right,0px) + 12px) 8px calc(env(safe-area-inset-left,0px) + 12px)}
#dockRow>*{pointer-events:auto}
#dockRow .spacer{flex:1;pointer-events:none}
#dock.collapsed #dockRow{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px)}
#btnShelf{display:flex;align-items:center;gap:8px;background:linear-gradient(#3b342a,#2a251e);border:2px solid #5b4a2c;border-radius:14px;padding:7px 14px 7px 10px;font-weight:800;box-shadow:0 6px 18px #0009}
#btnShelf svg{width:30px;height:23px;fill:var(--yellow)}
#btnShelf[hidden]{display:none}
#btnPaint{font-family:var(--f-display);font-size:14px;letter-spacing:.03em;padding:9px 14px 7px;border-radius:12px;color:#fff;background:linear-gradient(90deg,#e84393,#7b3fe4 50%,#2b6fd6);box-shadow:0 4px 0 #3c1f7a,0 8px 20px #0008}
#btnPaint:active{transform:translateY(3px);box-shadow:0 1px 0 #3c1f7a}
#paintUI{left:0;right:0;bottom:0;padding:8px calc(env(safe-area-inset-right,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 10px) calc(env(safe-area-inset-left,0px) + 12px);background:linear-gradient(#2a251ef0,#1b1813f8);border-top:3px solid #7b3fe4;display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:center;gap:10px;min-width:0}
.prow.ctl{flex-wrap:wrap;gap:8px}
.plab{font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);width:64px;flex:none}
.sws{display:flex;gap:6px;overflow-x:auto;padding:2px;min-width:0;scrollbar-width:none}
.sws::-webkit-scrollbar{display:none}
.sw{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid #0008;box-shadow:inset 0 -3px 6px #0005, inset 0 3px 5px #fff4}
.sw.on{outline:3px solid var(--yellow);outline-offset:2px}
#paintUI .seg{flex:none}
#paintUI .btn{flex:none;min-width:0;padding:7px 12px}
#sprayLeft{font-size:12px;color:var(--muted);font-weight:700}
.card.none svg,.card.piston svg{margin:0 auto}
.card.piston.sel{border-color:var(--green);box-shadow:0 0 0 2px #4cc36b55 inset}
.card .tag.ok{background:var(--green);color:#0b2010}
#btnDyno{font-family:var(--f-display);font-size:15px;letter-spacing:.03em;background:var(--yellow);color:var(--yellow-ink);padding:10px 16px 8px;border-radius:12px;box-shadow:0 4px 0 #a87b00, 0 8px 20px #0008}
#btnDyno:active{transform:translateY(3px);box-shadow:0 1px 0 #a87b00}

/* Shelf */
#shelf{pointer-events:auto;height:calc(156px + env(safe-area-inset-bottom,0px));padding:0 calc(env(safe-area-inset-right,0px) + 8px) env(safe-area-inset-bottom,0px) calc(env(safe-area-inset-left,0px) + 8px);background:linear-gradient(#2a251ef0,#1b1813f8);border-top:3px solid #5b4a2c;box-shadow:0 -6px 24px #0007}
#tabs{display:flex;gap:4px;overflow-x:auto;padding:6px 2px 4px;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:none;font-weight:800;font-size:13px;padding:3px 11px;border-radius:8px;background:#332d24;color:var(--muted);white-space:nowrap}
.tab.on{background:var(--yellow);color:var(--yellow-ink)}
.tab small{opacity:.7;margin-left:3px}
#cards{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:2px 2px 8px;height:116px;touch-action:pan-x;scrollbar-width:thin}
.card{flex:none;width:104px;height:108px;position:relative;display:flex;flex-direction:column;align-items:center;background:linear-gradient(#3b342a,#2c271f);border:1px solid #4c4335;border-radius:12px;padding:3px 5px 5px;touch-action:pan-x;text-align:center}
.card img{width:92px;height:58px;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
.card .nm{font-weight:800;font-size:12.5px;line-height:1.05;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:96px}
.card .st{font-size:11px;color:var(--muted);line-height:1.1;white-space:nowrap}
.card .cond{position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:2px;background:#0006;overflow:hidden}
.card .cond i{display:block;height:100%}
.card .tag{position:absolute;right:4px;top:10px;font-size:10px;font-weight:800;background:#000a;color:#ffb1a6;border-radius:5px;padding:0 5px}
.card.broken img{filter:grayscale(1) brightness(.55) sepia(.6)}
.card.broken .tag{background:var(--red);color:#fff}
.card.dim img{opacity:.55}
.card.inst{border:2px solid var(--yellow);box-shadow:0 0 0 2px #ffc21a40,0 0 16px #ffc21a55;background:linear-gradient(#4a3f26,#2f2a1d)}
.card.inst:active{transform:none}
.card:active{transform:scale(.97)}
.empty{color:var(--muted);padding:26px 8px;font-weight:600}

/* Drag & drop */
#ghost{position:absolute;z-index:30;pointer-events:none;width:110px;margin:-50px 0 0 -55px;filter:drop-shadow(0 10px 14px #000a)}
#ghost img{width:110px}
#ghost .gl{display:block;text-align:center;font-weight:800;font-size:13px;background:var(--panel-solid);border-radius:8px;padding:1px 6px;margin-top:-4px}
#ghost .gl.bad{color:#ffb1a6}#ghost .gl.good{color:#9be3ae}
#dump{left:calc(env(safe-area-inset-left,0px) + 12px);bottom:calc(var(--shelfH,156px) + 12px);width:132px;height:86px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:var(--f-display);font-size:13px;color:#fff;background:repeating-linear-gradient(-45deg,#2e7d32 0 14px,#25692a 14px 28px);border:3px dashed #c9f5cc;z-index:20}
#dump small{font-family:var(--f-body);font-weight:700;font-size:11px;opacity:.9}
#dump.hot{transform:scale(1.08);border-color:var(--yellow)}

/* Toast */
#toast{left:50%;top:calc(env(safe-area-inset-top,0px) + 54px);transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:40;pointer-events:none;width:min(92vw,460px)}
.tst{background:var(--panel-solid);border:1px solid var(--line);border-left:5px solid var(--yellow);padding:6px 12px;border-radius:10px;font-weight:700;box-shadow:0 8px 20px #0008;animation:tin .25s ease-out}
.tst.bad{border-left-color:var(--red)}.tst.good{border-left-color:var(--green)}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}

/* Sheet (popup) */
#sheetWrap{position:absolute;inset:0;z-index:50;background:#0007;display:flex;align-items:flex-end;justify-content:center;padding:0 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
#sheet{width:min(100%,440px);max-height:calc(100% - 24px);overflow:auto;background:var(--panel-solid);border:1px solid var(--line);border-radius:18px;padding:14px 16px 16px;box-shadow:0 -10px 40px #000a;animation:sup .22s ease-out}
@keyframes sup{from{transform:translateY(30px);opacity:0}}
#sheet h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:20px;color:var(--yellow);text-wrap:balance}
#sheet .sub{color:var(--muted);font-weight:600;margin-bottom:8px}
#sheet p{margin:6px 0;line-height:1.35}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;margin:8px 0;font-variant-numeric:tabular-nums}
.kv span{color:var(--muted)}.kv b{font-weight:800}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{flex:1;min-width:120px;font-weight:800;padding:9px 14px;border-radius:12px;background:#3a332a;border:1px solid #574b39}
.btn.pri{background:var(--yellow);color:var(--yellow-ink);border-color:#a87b00}
.btn.dng{background:#5a221b;border-color:#8a3328;color:#ffd4cd}
.btn:disabled{opacity:.45}
.seg{display:flex;background:#2b2720;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:6px 8px;border-radius:9px;font-weight:800;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--yellow);color:var(--yellow-ink)}
.seg button.on.race{background:var(--red);color:#fff}

/* Turbo screw */
.screw{display:flex;align-items:center;gap:12px;margin:8px 0}
.screw svg{width:96px;height:96px;flex:none;touch-action:none;cursor:grab}
.screw .sv{font-family:var(--f-display);font-size:22px;color:var(--text)}
.screw .sv small{font-family:var(--f-body);font-size:13px;color:var(--muted);display:block}
.pm{display:flex;gap:6px;margin-top:4px}
.pm button{width:40px;height:34px;border-radius:9px;background:#3a332a;border:1px solid #574b39;font-weight:800;font-size:18px}

/* Junk yard list */
.junk{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.jitem{background:#2b2720;border:1px solid #463d30;border-radius:12px;padding:6px;display:flex;flex-direction:column;align-items:center;text-align:center}
.jitem img{width:100%;height:62px;object-fit:contain}
.jitem b{font-size:13px;line-height:1.1}
.jitem .st{font-size:11px;color:var(--muted)}
.jitem .btn{min-width:0;width:100%;margin-top:4px;padding:5px 8px}

/* Papu bubble */
#papu{left:calc(env(safe-area-inset-left,0px) + 12px);bottom:calc(var(--dockH,210px) + 8px);max-width:min(360px,70vw);background:#fff8e6;color:#2a2116;border-radius:16px 16px 16px 4px;padding:9px 12px 10px;box-shadow:0 10px 30px #0009;font-weight:600;line-height:1.3}
#papu b{font-family:var(--f-display);font-weight:400;color:#c2410c;font-size:14px;display:block}
#papu button{margin-top:6px;background:#2a2116;color:#fff8e6;border-radius:9px;padding:3px 12px;font-weight:800}

/* Dyno UI */
#dyno{position:absolute;inset:0;z-index:8;pointer-events:none}
#dyno>*{pointer-events:auto}
#dynoBack{position:absolute;left:calc(env(safe-area-inset-left,0px) + 12px);top:calc(env(safe-area-inset-top,0px) + 50px)}
#dynoPanel{position:absolute;left:calc(env(safe-area-inset-left,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(330px,calc(100% - 150px));background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
#dynoTop{display:flex;gap:10px;align-items:center}
#rpmG{width:110px;height:110px;flex:none}
#dynoNums{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
#dynoNums .big{font-family:var(--f-display);font-size:24px;line-height:1}
#dynoNums .big small{font-family:var(--f-body);font-size:13px;color:var(--muted)}
#pedalWrap{position:absolute;right:calc(env(safe-area-inset-right,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;flex-direction:column;gap:10px;align-items:flex-end}
#ignite{font-family:var(--f-display);font-size:14px;padding:10px 14px 8px;border-radius:12px;background:#2f6d3a;color:#e7ffe9;box-shadow:0 4px 0 #1b4423}
#ignite.on{background:#6d2f2f;box-shadow:0 4px 0 #441b1b}
#pedal{width:118px;height:150px;border-radius:18px;background:repeating-linear-gradient(0deg,#4a4f57 0 10px,#363a40 10px 14px);border:3px solid #22252a;box-shadow:0 8px 0 #111,0 14px 30px #000a;font-family:var(--f-display);font-size:16px;color:#e8edf2;touch-action:none;transition:transform .06s}
#pedal.down{transform:translateY(6px) scale(.97);box-shadow:0 2px 0 #111}
#pedal:disabled{opacity:.4}
#dynoMsg{font-weight:700;font-size:13px;color:var(--muted);min-height:18px}
#dynoMsg.warn{color:var(--amber)}#dynoMsg.bad{color:var(--red)}

#loading{position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--ink);font-family:var(--f-display);color:var(--yellow);font-size:22px;transition:opacity .4s}
#loading small{font-family:var(--f-body);color:var(--muted);font-size:14px}


/* Ajotila */
#btnDrive{font-family:var(--f-display);font-size:15px;letter-spacing:.03em;background:linear-gradient(#5fd17c,#2f9e4e);color:#062611;padding:10px 16px 8px;border-radius:12px;box-shadow:0 4px 0 #1d5a31, 0 8px 20px #0008}
#btnDrive:active{transform:translateY(3px);box-shadow:0 1px 0 #1d5a31}
#btnHome{display:none;background:var(--yellow);color:var(--yellow-ink);border-color:#a87b00;font-weight:800}
#app.driving #btnHome{display:inline-block}
#app.driving #btnJunk,#app.driving #btnInfo,#app.driving #btnDynos,#app.driving #btnTrophy{display:none!important}
#dGearRow{display:flex;align-items:center;gap:6px}
#dGearRow button{width:44px;height:38px;border-radius:10px;background:linear-gradient(#4a4f57,#30343a);border:2px solid #22252a;color:#e8edf2;font-size:18px}
#dGearD{width:44px;height:38px;border-radius:10px;background:#0c0d0f;border:2px solid #3b3d40;font-family:var(--f-display);font-size:22px;line-height:36px;text-align:center;color:#ff5a1f}
#dGearRow.ev #dShDn,#dGearRow.ev #dShUp{opacity:.3}
#dMeasure{flex:1;width:auto!important;font-family:var(--f-display);font-size:14px!important;background:linear-gradient(#5fd17c,#2f9e4e)!important;color:#062611!important;border-color:#1d5a31!important}
#dMeasure.on{background:linear-gradient(#ffb238,#e07a10)!important;color:#2a1600!important;border-color:#8a4a00!important;animation:pulse 1s infinite}
@keyframes pulse{50%{filter:brightness(1.2)}}
.dlist{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.ditem{display:grid;grid-template-columns:auto 1fr;gap:0 12px;text-align:left;background:#2b2720;border:1px solid #463d30;border-radius:12px;padding:8px 12px}
.ditem b{grid-row:span 2;font-family:var(--f-display);font-weight:400;font-size:20px;color:var(--yellow);align-self:center}
.ditem span{font-weight:800}.ditem small{color:var(--muted)}
@media (max-width:480px){#btnTrophy{font-size:0;padding:4px 9px}#btnTrophy::after{content:'🏆';font-size:15px}}
#app.driving #papu{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 54px);left:50%;transform:translateX(-50%);z-index:9;max-width:min(330px,56vw);font-size:13.5px}
@media (max-width:480px){#app.driving #papu{max-width:62vw;font-size:13px}}
#drive{position:absolute;inset:0;z-index:8;pointer-events:none}
#drive>*{pointer-events:auto;position:absolute}
#xTop{left:calc(env(safe-area-inset-left,0px) + 12px);top:calc(env(safe-area-inset-top,0px) + 8px);display:flex;flex-direction:row;align-items:center;gap:6px;pointer-events:none}
#xTree{left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 7px);display:flex;gap:6px;background:#141517ee;border:2px solid #3b3d40;border-radius:16px;padding:6px 10px;pointer-events:none;box-shadow:0 8px 20px #0009}
#xTree[hidden]{display:none}
@media (max-width:900px){#xTree{top:calc(env(safe-area-inset-top,0px) + 50px)}}
#xTree i{width:22px;height:22px;border-radius:50%;background:#2a2b2e;box-shadow:inset 0 2px 4px #0008}
#xTree i.on[data-l=pre],#xTree i.on[data-l=stage]{background:#8cc8ff;box-shadow:0 0 12px #6fb7ff}
#xTree i.on[data-l^=a]{background:#ffb238;box-shadow:0 0 14px #ffa21a}
#xTree i.on[data-l=green]{background:#5dff86;box-shadow:0 0 16px #3dff6a}
#xTree i.on[data-l=red]{background:#ff4a3a;box-shadow:0 0 16px #ff2a1a}
#xTree .sep{width:2px;background:var(--line);margin:0 2px}
#xTgt{font-size:12px;font-weight:700;color:#ffd257}
#xInfo{display:flex;align-items:baseline;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:2px 12px}
#xTime{font-family:var(--f-display);font-weight:400;font-size:19px;line-height:30px;font-variant-numeric:tabular-nums;min-width:78px;text-align:right}
#xDist{color:var(--muted);font-weight:800}
#xProgW{width:180px;height:5px;border-radius:3px;background:#2b2720;overflow:hidden}
#xProg{display:block;height:100%;width:0;background:var(--yellow)}

/* Kisat: valikko, vastustaja, lähtölaskenta, tulostaulu */

#xStamp .mark b{font-family:var(--f-display);font-weight:400;font-size:clamp(40px,11vw,92px);line-height:1;letter-spacing:.04em}

#xStamp .tool{position:absolute;left:-4%;right:-4%;bottom:-8%;height:230%;transform:translateY(-140vh) scale(1.25);transform-origin:50% 100%;filter:drop-shadow(0 18px 18px #000a)}
#xStamp .tool svg{width:100%;height:100%;display:block}

/* ================= GEOMETRIAAPURIT ================= */
function mk(geo, mat, x = 0, y = 0, z = 0, parent) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true;
  if (parent) parent.add(m);
  return m;
}
function rb(w, h, d, r, mat, x, y, z, parent) {
  const rr = Math.max(0.001, Math.min(r, Math.min(w, h, d) / 2 - 0.002));
  return mk(new RoundedBoxGeometry(w, h, d, 3, rr), mat, x, y, z, parent);
}
function cyl(rt, rbt, h, mat, axis, x, y, z, parent, seg = 24, open = false) {
  const g = new THREE.CylinderGeometry(rt, rbt, h, seg, 1, open);
  if (axis === 'x') g.rotateZ(Math.PI / 2);
  if (axis === 'z') g.rotateX(Math.PI / 2);
  return mk(g, mat, x, y, z, parent);
}
const _up = new THREE.Vector3(0, 1, 0);
function tube(parent, a, b, r, mat, seg = 12) {
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b), d = B.clone().sub(A), L = d.length();
  const m = mk(new THREE.CylinderGeometry(r, r, L, seg), mat, 0, 0, 0, parent);
  m.position.copy(A).addScaledVector(d, 0.5);
  m.quaternion.setFromUnitVectors(_up, d.normalize());
  return m;
}
function shapeOf(cmds) {
  const s = new THREE.Shape();
  for (const c of cmds) s[c[0]](...c.slice(1));
  return s;
}
function extr(cmds, depth, bevel, mat, z, parent) {
  const g = new THREE.ExtrudeGeometry(shapeOf(cmds), {depth, bevelEnabled:bevel > 0, bevelThickness:bevel, bevelSize:bevel, bevelSegments:3, curveSegments:14});
  g.translate(0, 0, -depth / 2);
  return mk(g, mat, 0, 0, z, parent);
}
const G = () => new THREE.Group();

function headlight(parent, x, y, z, r = 0.1) {
  const hl = G(); hl.position.set(x, y, z); parent.add(hl);
  cyl(r * 1.1, r * 0.9, r * 1.6, MAT.chrome, 'x', 0, 0, 0, hl);
  cyl(r * 0.95, r * 0.95, 0.02, MAT.lamp, 'x', r * 0.8, 0, 0, hl);
  return hl;
}
function grille(parent, x, y, h, w, bars, horiz = false) {
  const gr = G(); gr.position.set(x, y, 0); parent.add(gr);
  rb(0.08, h, w, 0.04, MAT.chrome, 0, 0, 0, gr);
  rb(0.06, h * 0.8, w * 0.88, 0.02, MAT.black, 0.02, 0, 0, gr);
  for (let i = 0; i < bars; i++) {
    const t = (i + 0.5) / bars - 0.5;
    if (horiz) rb(0.04, 0.025, w * 0.86, 0.01, MAT.chrome, 0.045, t * h * 0.78, 0, gr);
    else rb(0.04, h * 0.78, 0.025, 0.01, MAT.chrome, 0.045, 0, t * w * 0.86, gr);
  }
  return gr;
}
function sides(g, cmds, hw, P, t = 0.06) { for (const s of [1, -1]) extr(cmds, t, 0.03, P, s * (hw - t / 2), g); }
function rails(g, len, y, z, x = 0) { for (const s of [1, -1]) rb(len, 0.12, 0.15, 0.03, MAT.dark, x, y, s * z, g); }
function bumpers(g, xf, xr, y, w, mat = MAT.chrome) {
  rb(0.1, 0.1, w, 0.04, mat, xf, y, 0, g); rb(0.1, 0.1, w, 0.04, mat, xr, y, 0, g);
}

  const h = o.y1 - o.y0, aA = Math.atan2(o.df, h), aC = Math.atan2(o.dr, h);
  const LA = Math.hypot(o.df, h), LC = Math.hypot(o.dr, h);
  const R = o.R || o.P;

/* ---------- Purkaamo ---------- */
function genJunk() {
  // Romu-Rane: enintään yhtä pykälää parempia kuin oma paras osa samaa lajia, eli tarjonta paranee sitä mukaa kun osia kertyy.
  // Kasassa voi olla myös osia, jotka sinulla jo on. Kuntoa ei näe ennen ostoa, ja noin joka neljäs osa on rikki.
  const ids = Object.keys(PARTS).filter(id => !['additive', 'tool'].includes(PARTS[id].slot) && !PARTS[id].noShop && TIERS()[id] <= famTopTier(id) + 1 && (PARTS[id].slot !== 'chassis' || Math.random() < 0.3));
  // Demo 30: tasaisempi valikoima. Paino oman parhaan osan tason mukaan: yhtä pykälää parempi 0,8, oman tason
  // ympäristö 1, kaksi pykälää huonompi 0,55, vielä huonommat 0,3. Sama osalaji arvotaan harvemmin kahdesti (vaihtelua).
  const T = TIERS(), w = ids.map(id => { const d = famTopTier(id) - T[id]; return d < 0 ? 0.8 : d <= 1 ? 1 : d === 2 ? 0.55 : 0.3; });
  const out = [];
  for (let k = 0; k < 4 && ids.length; k++) {
    let r = Math.random() * w.reduce((a, b) => a + b, 0), n = 0;
    while (n < ids.length - 1 && (r -= w[n]) > 0) n++;
    const id = ids.splice(n, 1)[0]; w.splice(n, 1);
    ids.forEach((x, i) => { if (PARTS[x].slot === PARTS[id].slot) w[i] *= 0.25; });
    const cond = Math.random() < 0.25 ? 0 : Math.round(rnd(0.3, 0.9) * 100) / 100;
    out.push({id, cond, price:Math.max(5, Math.round(PARTS[id].price * rnd(0.15, 0.3) / 5) * 5)});
  }
  return out;
}

const canvas = renderer.domElement;

  canvas.setPointerCapture(e.pointerId);

  if (paintMode.on && paintMode.mode === 'spray' && pointers.size === 1) { paintMode.last = null; startHiss(); sprayAt(e.clientX, e.clientY); tapStart = null; return; }
  if (pointers.size === 1) tapStart = {x:e.clientX, y:e.clientY, t:performance.now(), moved:0};
  else { tapStart = null; pinch0 = pdist(); r0 = cam.tr; stopHiss(); }
});
canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
  if (pointers.size === 1 && paintMode.on && paintMode.mode === 'spray') { sprayAt(e.clientX, e.clientY); return; }
  if (pointers.size === 1) {
    cam.theta -= dx * 0.008; cam.phi = clamp(cam.phi - dy * 0.006, 0.35, 1.47);
    if (tapStart) tapStart.moved += Math.abs(dx) + Math.abs(dy);

});
const cEnd = e => {

  if (tapStart && tapStart.moved < 8 && performance.now() - tapStart.t < 450) pick(e.clientX, e.clientY);

};

(function bindDragControls() {
  for (const [id, k] of [['gas', 'gas'], ['brake', 'brk']]) {
    const b = $(id);
    b.addEventListener('pointerdown', e => { e.preventDefault(); b.setPointerCapture(e.pointerId); DRV[k] = true; b.classList.add('down'); });
    const off = () => { DRV[k] = false; b.classList.remove('down'); };
    b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('lostpointercapture', off);
    b.addEventListener('contextmenu', e => e.preventDefault());
  }
  // kytkin (vaikea taso)
  const cl = $('clutch');
  cl.addEventListener('pointerdown', e => { e.preventDefault(); cl.setPointerCapture(e.pointerId); clutchDown(); });
  const cu = () => clutchUp();
  cl.addEventListener('pointerup', cu); cl.addEventListener('pointercancel', cu); cl.addEventListener('lostpointercapture', cu);
  cl.addEventListener('contextmenu', e => e.preventDefault());
  for (const [id, dir] of [['shUp', 1], ['shDn', -1]]) { const b = $(id); b.addEventListener('pointerdown', e => { e.preventDefault(); b.classList.add('down'); shift(dir); }); const up = () => b.classList.remove('down'); b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('contextmenu', e => e.preventDefault()); }
  window.addEventListener('keydown', e => {
    if (!DRV.on || e.repeat) { if (DRV.on && /^Arrow|Space/.test(e.code)) e.preventDefault(); return; }
    DRV.keys[e.code] = true;
    if (!RALLY?.on && (e.code === 'ArrowRight' || e.code === 'KeyE')) shift(1);
    if (!RALLY?.on && (e.code === 'ArrowLeft' || e.code === 'KeyQ')) shift(-1);
    if (e.code === 'KeyC') $('dCam').click();
    if (e.code === 'KeyZ' || e.code === 'ShiftLeft') clutchDown();
    if (/^Arrow|Space/.test(e.code)) e.preventDefault();
  });
  window.addEventListener('keyup', e => { DRV.keys[e.code] = false; if (DRV.on && (e.code === 'KeyZ' || e.code === 'ShiftLeft')) clutchUp(); });
  $('dCam').onclick = () => { DRV.cam = DRV.cam === 'chase' ? 'cockpit' : 'chase'; sfx.tick(); $('dCam').textContent = DRV.cam === 'chase' ? 'Ohjaamo' : 'Takaa'; };
  $('btnHome').onclick = () => { sfx.tick(); goHome('Takaisin pajassa!'); };
  $('btnDrive').onclick = startDrive;
})();

    <div class="row"><button class="btn" id="rrHome">Pajaan</button></div>`, root => {

const radio = {
  bus:null, timer:null, playing:false, step:0, nextT:0, bpm:108, seed:7,
  want() { return state.music !== false && soundOn && !(DRV && DRV.on) && !dyno.on && !!AU.ctx && !document.hidden; },

  sync() { this.want() ? this.play() : this.pause(); },
  build(c) {

  tick() {

  // harmonikka: kaksi hieman eri vireessä olevaa sahaa ja vibrato
  acc(t, f0, d, v = 0.12) {

  },
  lead(t, f0, d) {

  },

function radioSheet() {

function canBuyTier(id) { return TIERS()[id] <= famTopTier(id) + 2; }
function shopCards(cat) {
  if (!state.shop) return '';
  return Object.entries(PARTS).filter(([id, d]) => d.cat === cat && !owned(id) && (!d.noShop || d.shopIf?.())).sort((a, b) => TIERS()[a[0]] - TIERS()[b[0]] || a[1].price - b[1].price).map(([id, d]) => {
    const ok = canBuyTier(id);
    return `<button class="card shop${ok ? '' : ' locked'}" data-buy="${id}" aria-label="${esc(ok ? d.name : 'Lukittu osa')}"><img src="${THUMBS[id] || ''}" alt=""><span class="nm">${esc(ok ? d.name : '???')}</span><span class="st">${ok ? cardStat({id, cond:1}) : 'lukittu'}</span><span class="price">${ok ? (d.shopPrice ?? d.price) + ' €' : '??? €'}</span></button>`;
  }).join('');
}
function openShopSheet(id) {
  guideOnce('kauppa');
  if (PARTS[id].shopSheet) return PARTS[id].shopSheet();  // esim. Rohvessorin lisäaine: oma kohtaus
  const d = PARTS[id], ok = canBuyTier(id);
  if (!ok) { openSheet(`<h2>???</h2><div class="sub">${esc(SLOT_NAME[d.slot])} · lukittu</div><p>Tämä osa on vielä liian kova. Osta ensin parempia ${esc(SLOT_NAME[d.slot].toLowerCase())}-osia – kauppa avaa aina kaksi seuraavaa tasoa.</p><div class="row"><button class="btn pri" id="shOk">Selvä</button></div>`, r => { r.querySelector('#shOk').onclick = closeSheet; }); return; }
  const afford = state.money >= d.price;
  openSheet(`<h2>${esc(d.name)}</h2><div class="sub">${esc(SLOT_NAME[d.slot])}${d.sub ? ' · ' + esc(d.sub) : ''} · kaupassa</div>
    <div class="kv"><span>Ominaisuudet</span><b>${cardStat({id, cond:1})}</b><span>Hinta</span><b>${d.price} €</b><span>Rahaa</span><b>${state.money} €</b></div>
    ${afford ? '' : `<p class="warn">Rahat eivät riitä. Aja kisoja ja cupeja, niin saat lisää.</p>`}
    <div class="row"><button class="btn pri" id="shBuy" ${afford ? '' : 'disabled'}>Osta ${d.price} €</button><button class="btn" id="shNo">Sulje</button></div>`, r => {
    r.querySelector('#shNo').onclick = closeSheet;
    r.querySelector('#shBuy').onclick = () => {
      if (state.money < d.price) return;
      state.money -= d.price; state.inv.push(newInst(id)); save(); renderAll(); closeSheet(); sfx.cash();
      toast(`${d.name} ostettu! Se odottaa hyllyssä.`, 'good');
    };
  });
}

function crazyLaugh() {
  const c = au(); if (!c) return; const t0 = c.currentTime;
  for (let i = 0; i < 14; i++) {
    const t = t0 + i * 0.13, o = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain();
    o.type = 'sawtooth'; const base = 260 + Math.sin(i * 0.9) * 90 + (i > 9 ? 120 : 0);
    o.frequency.setValueAtTime(base * 1.25, t); o.frequency.exponentialRampToValueAtTime(base, t + 0.09);
    f.type = 'bandpass'; f.frequency.value = 900 + (i % 3) * 300; f.Q.value = 3;
    o.connect(f); f.connect(g); g.connect(AU.master); env(g, t, 0.01, 0.14, 0.1); o.start(t); o.stop(t + 0.14);
  }
}

## Kuvaus
Max Newton on suomenkielinen kiihdytysautopeli autoista kiinnostuneille, pääkohderyhmänä 16–40-vuotiaat suomalaiset miehet

- Kaasu nousee 0,7 s:ssa nollasta täyteen; automaattivaihteistossa 1 s:n lukko vaihdon jälkeen (ei 1↔2-vatkausta). Lava + 600 hv maastorenkailla lähtee nyt soralla ja asfaltilla.

- Hajoavat: aita, laatikko (myös pinot), postilaatikko, huussi, linnunpelätin, lumiukko (vain lumella, pallot vierivät). Työnnettävät: paali, tynnyri, kartio. Osat jäävät radalle ja ovat törmättäviä. Lentävä paali voi kaataa aidan.
- Puut ja kivet: impulssi + kitka (sivuosuma ei pysäytä).
- Vauriot 0–100 %: yli 30 % teho laskee, yli 45 % auto vetää sivulle, yli 60 % savuaa, yli 70 % nykii. 15 % valot, 25 % siipi, 40 % pakoputki irtoaa. Lommot runkoon. 100 % = AUTO ROMUTTUI. Auto palautuu ajon jälkeen.
- Kaaos-metri: pisteet kappaleista, kombo ×1,5…×3 kun osumat 2,5 s sisällä. Paras kaaos per alusta tallessa.
- Katsojat poistettu. rallyNearest hakee koko radalta, jos auto on yli 30 m päässä.

## Demo 33 – Ralli vain testiversiossa

`build.sh` kokoaa pääpelin ilman `p12_ralli.js`-tiedostoa ja testiversion sen kanssa (Ralli-nappi näkyy vain, kun
`window.MN_TEST`). `test_main.html` = pääpeli paikallisella three.js:llä testejä varten. Rallin muutokset: pito soralla ja
lumella selvästi parempi (`SURFACES.gravel/snow`), pituuspito ×1,3, luistonesto isossa luisussa, kääntymisen ja sivuttais-
nopeuden vaimennus (perän saa kiinni vastaohjauksella), terävämpi ohjaus, vaihto ylös 85 %:ssa ja sutiessa rajoittimella.
Ajanotto m:ss,ss (`rallyFmt`). Ajettava alue ulottuu 28 m:n päähän radasta: nurmella vierintävastus ja ilmanvastus kasvavat
(tahmea), katsojat 16 m:n päässä. Esteet (`rallyObstacles`, `rallyCollide`): heinäpaalit lentävät ja vierivät (debris, pysyvät),
lauta-aidat hajoavat laudoiksi, puut ja kivet ovat kovia (`R.hard`).

import asyncio, sys, json
from playwright.async_api import async_playwright
# Käyttö: drive_test.py W H "toiminnot" — kuten shot.py, mutta kuvat otetaan vain shot:-käskyillä
async def main():
    w,h = int(sys.argv[1]), int(sys.argv[2]); actions = sys.argv[3] if len(sys.argv)>3 else ''
    async with async_playwright() as p:
        b = await p.chromium.launch(args=['--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader','--ignore-gpu-blocklist'])
        pg = await b.new_page(viewport={'width':w,'height':h}, device_scale_factor=1, has_touch=True)
        logs=[]
        pg.on('console', lambda m: logs.append(f'{m.type}: {m.text}'))
        pg.on('pageerror', lambda e: logs.append(f'PAGEERROR: {e}'))
        await pg.goto('http://localhost:8765/test.html')
        await pg.wait_for_timeout(5000)
        try:
          await run(pg, actions, logs)
        except Exception as e:
          logs.append('EXC '+str(e)[:300])
        print('\n'.join(logs[:60]))
        await b.close()
async def run(pg, actions, logs):
        for a in actions.split('§'):
            a=a.strip()
            if not a: continue
            if a.startswith('js:'):
                r = await pg.evaluate(a[3:])
                if r is not None: logs.append('JS-> '+json.dumps(r)[:900])
            elif a.startswith('wait:'): await pg.wait_for_timeout(int(a[5:]))
            elif a.startswith('click:'): await pg.click(a[6:], timeout=5000)
            elif a.startswith('shot:'): await pg.screenshot(path=a[5:], timeout=120000)
asyncio.run(main())
